# Dev stack with live reload:   docker compose up --watch
# Production-style build:       docker compose -f compose.yaml -f compose.prod.yaml up --build

services:
  api:
    build:
      context: ./apps/api
      target: dev
    ports:
      - "8000:8000"
    environment:
      ALLOWED_ORIGINS: http://localhost:3000
      MODEL_DIR: /app/models
      DATA_DIR: /data
    volumes:
      - ./data:/data
      # Trained weights + metrics live on the host, so `ml.train` output survives rebuilds.
      - ./apps/api/models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    develop:
      watch:
        # Code edits are copied into the container; uvicorn --reload restarts the server.
        - action: sync
          path: ./apps/api
          target: /app
          ignore:
            - .venv/
            - __pycache__/
            - models/
            - requirements.txt
        # New dependencies -> rebuild the image.
        - action: rebuild
          path: ./apps/api/requirements.txt

  web:
    build:
      context: ./apps/web
      target: dev
    ports:
      - "3000:3000"
    environment:
      # Next.js forwards /api/* to the API container over the compose network.
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    develop:
      watch:
        # Code edits are copied into the container; Next.js hot-reloads the page.
        - action: sync
          path: ./apps/web
          target: /app
          ignore:
            - node_modules/
            - .next/
            - package.json
            - package-lock.json
        # New dependencies -> rebuild the image.
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/package-lock.json
